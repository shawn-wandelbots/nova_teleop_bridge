<text x="289" y="646" fill="#B9BAC0" font-size="13">Thumb + index close</text>
<path d="M489 555 h21 m-6 -5 l6 5 l-6 5" fill="none" stroke="#B9BAC0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="514" y="452" width="212" height="206" rx="12" fill="#171927" stroke="#34364A" stroke-width="1"/>
<text x="530" y="480" fill="#FFFFFF" font-size="16" font-weight="600">3  Point</text>
<rect x="532" y="540" width="22" height="64" rx="11" fill="#8E56FC"/>
<text x="543" y="622" fill="#B9BAC0" font-size="11.5" text-anchor="middle">thumb</text>
<rect x="568" y="512" width="22" height="92" rx="11" fill="#8E56FC"/>
<text x="579" y="622" fill="#B9BAC0" font-size="11.5" text-anchor="middle">index</text>
<rect x="604" y="574" width="22" height="30" rx="11" fill="#6B6E85"/>
<text x="615" y="622" fill="#B9BAC0" font-size="11.5" text-anchor="middle">mid</text>
<rect x="640" y="574" width="22" height="30" rx="11" fill="#6B6E85"/>
<text x="651" y="622" fill="#B9BAC0" font-size="11.5" text-anchor="middle">ring</text>
<rect x="676" y="574" width="22" height="30" rx="11" fill="#6B6E85"/>
<text x="687" y="622" fill="#B9BAC0" font-size="11.5" text-anchor="middle">little</text>
