<circle cx="854" cy="180" r="13" fill="#8E56FC"/><text x="854" y="185" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">B</text>
<circle cx="864" cy="224" r="13" fill="#020617" stroke="#B9BAC0" stroke-width="1.5"/><text x="864" y="229" fill="#B9BAC0" font-size="14" font-weight="700" text-anchor="middle">A</text>
<text x="880" y="108" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle">Index trigger</text>
<path d="M872 294 H840" stroke="#B9BAC0" stroke-width="1"/>
<text x="836" y="299" fill="#B9BAC0" font-size="13" text-anchor="end">Grip</text>
<text x="880" y="356" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle">Right controller</text>
<text x="250" y="118" fill="#9D83F6" font-size="13" font-weight="700" letter-spacing="1.2">NEXT GESTURE</text>
