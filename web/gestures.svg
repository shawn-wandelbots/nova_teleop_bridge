<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title id="t">Hand gestures with the controllers</title>
<desc id="d">Y plus left trigger, or B plus right trigger, switches to the next hand gesture: grasp, pinch, point, three-finger pinch. Tap Y or B to rotate the thumb, hold to swing it.</desc>
<rect width="1000" height="760" rx="16" fill="#141623"/>
<text x="32" y="46" fill="#FFFFFF" font-size="24" font-weight="600">Hand gestures</text>
<text x="32" y="72" fill="#B9BAC0" font-size="15">The index trigger closes the hand. These buttons choose which fingers close.</text>
<rect x="98" y="240" width="44" height="92" rx="20" fill="#171927" stroke="#34364A" stroke-width="2"/>
<rect x="112" y="274" width="16" height="40" rx="8" fill="#020617" stroke="#9D83F6" stroke-width="1.5"/>
<circle cx="120" cy="200" r="60" fill="#171927" stroke="#34364A" stroke-width="2"/>
<rect x="90" y="118" width="60" height="20" rx="10" fill="#8E56FC"/>
