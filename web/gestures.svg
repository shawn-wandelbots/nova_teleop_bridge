<circle cx="146" cy="180" r="13" fill="#8E56FC"/><text x="146" y="185" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">Y</text>
<circle cx="136" cy="224" r="13" fill="#020617" stroke="#B9BAC0" stroke-width="1.5"/><text x="136" y="229" fill="#B9BAC0" font-size="14" font-weight="700" text-anchor="middle">X</text>
<text x="120" y="108" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle">Index trigger</text>
