<path d="M730 555 h21 m-6 -5 l6 5 l-6 5" fill="none" stroke="#B9BAC0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="755" y="452" width="212" height="206" rx="12" fill="#171927" stroke="#34364A" stroke-width="1"/>
