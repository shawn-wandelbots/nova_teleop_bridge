<path d="M430 360 H452 m-7 -6 l7 6 l-7 6" fill="none" stroke="#B9BAC0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="464" y="365" fill="#FFFFFF" font-size="15">swing the thumb sideways</text>
<line x1="32" x2="968" y1="404" y2="404" stroke="#34364A"/>
<text x="32" y="436" fill="#9D83F6" font-size="13" font-weight="700" letter-spacing="1.2">THE FOUR GESTURES, IN ORDER</text>
<rect x="32" y="452" width="212" height="206" rx="12" fill="#171927" stroke="#34364A" stroke-width="1"/>
<text x="48" y="480" fill="#FFFFFF" font-size="16" font-weight="600">1  Grasp</text>
