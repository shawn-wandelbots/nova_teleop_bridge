<path d="M421 318 H443 m-7 -6 l7 6 l-7 6" fill="none" stroke="#B9BAC0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="455" y="323" fill="#FFFFFF" font-size="15">rotate the thumb one step</text>
<rect x="250" y="344" width="58" height="32" rx="16" fill="#171927" stroke="#9D83F6" stroke-width="1.5"/>
<text x="279.0" y="365" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle">Hold</text>
<rect x="316" y="344" width="34" height="32" rx="16" fill="#171927" stroke="#9D83F6" stroke-width="1.5"/>
<text x="333.0" y="365" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle">Y</text>
<text x="360" y="365" fill="#B9BAC0" font-size="15">or</text>
<rect x="384" y="344" width="34" height="32" rx="16" fill="#171927" stroke="#9D83F6" stroke-width="1.5"/>
