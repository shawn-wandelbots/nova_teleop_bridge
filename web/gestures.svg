<text x="120" y="356" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle">Left controller</text>
<rect x="858" y="240" width="44" height="92" rx="20" fill="#171927" stroke="#34364A" stroke-width="2"/>
<rect x="872" y="274" width="16" height="40" rx="8" fill="#020617" stroke="#9D83F6" stroke-width="1.5"/>
<circle cx="880" cy="200" r="60" fill="#171927" stroke="#34364A" stroke-width="2"/>
<rect x="850" y="118" width="60" height="20" rx="10" fill="#8E56FC"/>
