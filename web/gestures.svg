<rect x="412" y="690" width="22" height="22" rx="11" fill="#6B6E85"/><text x="442" y="706" fill="#FFFFFF" font-size="14">held closed</text>
<text x="968" y="706" fill="#B9BAC0" font-size="14" text-anchor="end">After gesture 4 it starts again at 1.</text>
<text x="32" y="740" fill="#B9BAC0" font-size="13">Hold both grips to move the arms. Fingers only follow while teleoperation is active.</text>
