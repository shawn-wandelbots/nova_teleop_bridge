<text x="295" y="240" fill="#B9BAC0" font-size="18" text-anchor="middle">+</text>
<rect x="306" y="218" width="34" height="32" rx="16" fill="#171927" stroke="#9D83F6" stroke-width="1.5"/>
<text x="323.0" y="239" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle">B</text>
